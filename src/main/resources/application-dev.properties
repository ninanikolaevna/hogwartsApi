# ============ ПРОФИЛЬ И ПОРТ ============
spring.profiles.active=dev
server.port=8081
# ============ НАСТРОЙКИ БАЗЫ ДАННЫХ H2 ============
spring.datasource.url=jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=10
# ============ JPA/HIBERNATE ============
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# ============ H2 CONSOLE ============
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false
# ============ ЛОГИРОВАНИЕ ============
# Детальное логирование для отладки многопоточности
logging.level.com.example.pro.sky.hogwartsApi=DEBUG
logging.level.com.example.pro.sky.hogwartsApi.service.StudentService=TRACE
logging.level.com.example.pro.sky.hogwartsApi.controller.StudentController=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# Паттерн с указанием имени потока (ВАЖНО для многопоточности)
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
# ============ LIQUIBASE ============
spring.liquibase.change-log=classpath:liquibase/changelog-master.yml
spring.liquibase.enabled=true
spring.liquibase.drop-first=false
# ============ ФАЙЛОВОЕ ХРАНИЛИЩЕ ============
avatars.dir.path=./avatars-dev
# Настройки для загрузки файлов
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
spring.servlet.multipart.enabled=true
# ============ MULTITHREADING SUPPORT ============
# Настройки сервера для обработки параллельных запросов
server.tomcat.max-threads=100
server.tomcat.min-spare-threads=20
server.tomcat.connection-timeout=5000
# ============ SWAGGER/OPENAPI ============
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.config-url=/api-docs/swagger-config
springdoc.api-docs.groups.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
debug=false
spring.output.ansi.enabled=ALWAYS