# Dev профиль
spring.profiles.active=dev
# Другой порт для dev
server.port=8081
# Dev база данных (можно использовать H2 для удобства)
spring.datasource.url=jdbc:h2:mem:devdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Hibernate для H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# H2 Console для разработки
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Подробное логирование в dev
logging.level.com.example.pro.sky.hogwartsApi=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
# Liquibase также работает
spring.liquibase.change-log=classpath:liquibase/changelog-master.yml
spring.liquibase.enabled=true
# Аватарки
avatars.dir.path=./avatars-dev