spring.application.name=pro.sky.hogwartsApi
spring.datasource.url=jdbc:postgresql://localhost:5432/hogwarts
spring.datasource.username=student
spring.datasource.password=chocolatefrog
# Hibernate ddl auto (create, create-drop, validate, update)
# ИЗМЕНИТЬ с update на validate (по заданию!)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# Директория для хранения аватарок
avatars.dir.path=./avatars
# Настройки для загрузки файлов
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
# Server port
server.port=8080
# Liquibase
spring.liquibase.change-log=classpath:liquibase/changelog-master.yml
spring.liquibase.enabled=true
# Логирование (базовые настройки)
logging.level.com.example.pro.sky.hogwartsApi=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
# ====================================