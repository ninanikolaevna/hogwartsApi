# ============ БАЗОВЫЕ НАСТРОЙКИ ============
spring.application.name=pro.sky.hogwartsApi
# ============ НАСТРОЙКИ БАЗЫ ДАННЫХ ============
spring.datasource.url=jdbc:postgresql://localhost:5432/hogwarts
spring.datasource.username=student
spring.datasource.password=chocolatefrog
spring.datasource.driver-class-name=org.postgresql.Driver
# Настройки пула соединений HikariCP
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# ============ JPA/HIBERNATE ============
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# ============ ФАЙЛОВОЕ ХРАНИЛИЩЕ ============
# Директория для хранения аватарок
avatars.dir.path=./avatars
# Настройки для загрузки файлов
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
spring.servlet.multipart.enabled=true
# ============ SERVER ============
server.port=8080
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=10
server.tomcat.connection-timeout=5000
# ============ LIQUIBASE ============
spring.liquibase.change-log=classpath:liquibase/changelog-master.yml
spring.liquibase.enabled=true
spring.liquibase.drop-first=false
# ============ ЛОГИРОВАНИЕ ============
# Уровни логирования
logging.level.com.example.pro.sky.hogwartsApi=INFO
logging.level.com.example.pro.sky.hogwartsApi.service=DEBUG  # ДОБАВЛЕНО
logging.level.com.example.pro.sky.hogwartsApi.controller=DEBUG  # ДОБАВЛЕНО
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# Паттерн логов с указанием потока (важно для многопоточности)
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
# ============ SWAGGER ============
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
# Кэширование
spring.cache.type=simple