# ============ ПРОФИЛЬ И ПОРТ ============
spring.profiles.active=prod
server.port=8082
# ============ PRODUCTION БАЗА ДАННЫХ (PostgreSQL) ============
spring.datasource.url=jdbc:postgresql://localhost:5432/hogwarts_prod
spring.datasource.username=${DB_USERNAME:student}
spring.datasource.password=${DB_PASSWORD:chocolatefrog}
spring.datasource.driver-class-name=org.postgresql.Driver
# Оптимизация пула соединений для production
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
# ============ JPA/HIBERNATE ДЛЯ PRODUCTION ============
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.format_sql=false
# ============ БЕЗОПАСНОСТЬ ============
spring.h2.console.enabled=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=true
# ============ LOGGING ДЛЯ PRODUCTION ============
logging.file.name=./logs/hogwarts-api-prod.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=100MB
logging.level.root=WARN
logging.level.com.example.pro.sky.hogwartsApi=INFO
logging.level.com.example.pro.sky.hogwartsApi.service.StudentService=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=ERROR
logging.level.org.apache.tomcat=WARN

logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %-40.40logger{36} : %msg%n
# ============ LIQUIBASE ============
spring.liquibase.change-log=classpath:liquibase/changelog-master.yml
spring.liquibase.enabled=true
spring.liquibase.drop-first=false
# ============ ФАЙЛОВОЕ ХРАНИЛИЩЕ ============
avatars.dir.path=./avatars-prod
# Создаем директорию, если её нет
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true
# ============ МНОГОПОТОЧНОСТЬ И ПРОИЗВОДИТЕЛЬНОСТЬ ============
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=50
server.tomcat.max-connections=10000
server.tomcat.accept-count=100
server.tomcat.connection-timeout=20000
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/json,application/javascript
server.compression.min-response-size=2048
server.connection-timeout=30000
server.max-http-header-size=8192
# ============ КЭШИРОВАНИЕ И ОПТИМИЗАЦИЯ ============
spring.cache.type=simple
spring.servlet.multipart.resolve-lazily=true
# ============ ACTUATOR И МОНИТОРИНГ ============
management.endpoints.web.base-path=/manage
management.endpoints.web.path-mapping.health=status
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# ============ SECURITY HEADERS ============
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
debug=false
trace=false
spring.application.admin.enabled=false
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=never