# ============ ПРОФИЛЬ И ПОРТ ============
spring.profiles.active=test
server.port=8080
# ============ IN-MEMORY БАЗА ДАННЫХ ДЛЯ ТЕСТОВ ============
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5
# ============ JPA/HIBERNATE ДЛЯ ТЕСТОВ ============
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=5
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false
# ============ НАСТРОЙКИ ДЛЯ ТЕСТИРОВАНИЯ ============
# Разрешаем переопределение бинов для тестов
spring.main.allow-bean-definition-overriding=true
# Отключаем Liquibase для чистых тестов
spring.liquibase.enabled=false
# Отключаем кэширование для детерминированных тестов
spring.cache.type=none
# ============ LOGGING ДЛЯ ТЕСТОВ ============
# Минимальное логирование, но сохраняем информацию о потоках для многопоточных тестов
logging.level.root=WARN
logging.level.com.example.pro.sky.hogwartsApi=INFO
logging.level.com.example.pro.sky.hogwartsApi.controller.StudentController=DEBUG
logging.level.com.example.pro.sky.hogwartsApi.service.StudentService=DEBUG
logging.level.org.springframework.test=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=ERROR
# Паттерн для тестов - сохраняем информацию о потоках
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{20} - %msg%n
# Отключаем файловое логирование в тестах
logging.file.name=
# ============ ФАЙЛОВОЕ ХРАНИЛИЩЕ ДЛЯ ТЕСТОВ ============
# Временная директория для тестов
avatars.dir.path=./target/test-avatars
# Ограничиваем размер файлов для тестов
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
spring.servlet.multipart.enabled=true
# ============ НАСТРОЙКИ ДЛЯ ТЕСТИРОВАНИЯ МНОГОПОТОЧНОСТИ ============
# Уменьшенные настройки для тестов
server.tomcat.max-threads=50
server.tomcat.min-spare-threads=5
server.tomcat.connection-timeout=10000
# Отключаем сжатие для точного тестирования
server.compression.enabled=false
# ============ ДОПОЛНИТЕЛЬНЫЕ НАСТРОЙКИ ТЕСТОВ ============
# Отключаем ненужные фичи для тестов
spring.h2.console.enabled=false
management.endpoints.web.exposure.include=
management.endpoint.health.show-details=never
# Отключаем Swagger UI для тестов
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
# Настройки для тестовой среды
spring.main.banner-mode=off
spring.output.ansi.enabled=never
# Время ожидания для тестов
server.connection-timeout=5000
# ============ НАСТРОЙКИ ДЛЯ ИНТЕГРАЦИОННЫХ ТЕСТОВ ============
# Отключаем автоматическое создание директорий для чистоты тестов
spring.servlet.multipart.resolve-lazily=false
# Ограничиваем сессии для тестов
server.servlet.session.timeout=5m